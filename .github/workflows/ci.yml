name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, web and contract tests
        run: mvn -B test
      - name: Database tests (Testcontainers, PostgreSQL 16)
        run: mvn -B test -Pintegration
