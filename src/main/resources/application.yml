# Configuration comes from the environment only (SPEC §2); defaults are the compose values.
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: kervan-core
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/kervan}
    username: ${DB_USER:kervan_core}
    password: ${DB_PASSWORD}
  flyway:
    schemas: public
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

kervan:
  service-token: ${SERVICE_TOKEN:svc-dev-token}
